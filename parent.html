<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>لوحة وليّ الأمر</title><link rel="stylesheet" href="app.css">
</head><body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0">لوحة وليّ الأمر</h1>
    <a class="btn sm" href="index.html" style="text-decoration:none">شاشة ماريا</a>
  </div>

  <section class="panel">
    <h2>الإعدادات</h2>
    <label class="field"><span>تاريخ الاختبار</span><input type="date" id="testDate"></label>
    <label class="field"><span>عدد البطاقات في الجلسة</span><input type="number" id="cards" min="4" max="20"></label>
    <label class="field"><span>دقائق الجلسة</span><input type="number" id="mins" min="3" max="30"></label>
    <label class="field"><span>هدف النجوم</span><input type="number" id="starT" min="10" max="300"></label>
    <label class="field"><span>اسم الجائزة</span><input type="text" id="prize" placeholder="مثلاً: رحلة إلى الحديقة"></label>
    <button class="btn go" id="saveSet" style="max-width:220px">احفظي</button>
    <p class="muted" id="setMsg" style="margin-top:10px"></p>
  </section>

  <section class="panel">
    <h2>الاختبارات</h2>
    <div class="rowbtns" style="margin-top:0">
      <button class="btn" id="exShort">اختبار قصير · ٤ أسئلة</button>
      <button class="btn" id="exFull">اختبار كامل · ٦٤ سؤالاً</button>
      <button class="btn soft" id="exDress">البروفة النهائية</button>
    </div>
    <p class="muted" id="dressNote" style="margin-top:10px">البروفة النهائية هي النموذج المحفوظ، وتُجرى مرة واحدة فقط.</p>
  </section>

  <section class="panel">
    <h2>سجلّ الاختبارات</h2>
    <div id="chart"></div>
    <div class="scroll-x" id="history"></div>
  </section>

  <section class="panel">
    <h2>المهارات</h2>
    <div id="warnings"></div>
    <div class="scroll-x" id="skillsTable"></div>
  </section>

  <section class="panel">
    <h2>النسخ الاحتياطي</h2>
    <div class="rowbtns" style="margin-top:0">
      <button class="btn" id="bkp">احفظي نسخة</button>
      <label class="btn" style="display:inline-grid;place-items:center">استعيدي نسخة
        <input type="file" id="rst" accept="application/json" hidden></label>
      <button class="btn" id="rset" style="border-color:#e0b7c9;color:var(--pink-deep)">مسح كل شيء</button>
    </div>
    <p class="muted" id="bkMsg" style="margin-top:10px"></p>
    <label class="field" style="margin-top:14px"><span>تاريخ تجريبي (للفحص فقط)</span>
      <input type="date" id="ovr"></label>
    <button class="btn sm" id="ovrSet">طبّقي</button>
    <button class="btn sm" id="ovrClr">إلغاء</button>
  </section>
</div>
<script src="generator.js"></script><script src="content/icons.js"></script>
<script src="content/shapes.js"></script><script src="content/diagrams.js"></script>
<script src="store.js"></script><script src="bank.js"></script>
<script src="scheduler.js"></script><script src="parent.js"></script>
</body></html>
