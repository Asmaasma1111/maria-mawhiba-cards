<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="بطاقات ماريا">
<meta name="theme-color" content="#cf5a8c">
<link rel="manifest" href="manifest.json">
<title>بطاقات ماريا</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ======= الرئيسية ======= -->
<section class="home" id="v-home" hidden>
  <button class="gear" id="gear" aria-label="إعدادات">⚙</button>
  <p class="hello" id="hello">أهلاً ماريا</p>

  <div class="choices" id="choices">
    <button class="big rev" id="goRevision">
      <span class="bigt">مراجعة</span>
      <span class="bigs">بطاقات بلا وقت. خمّني، ثم اكشفي الإجابة.</span>
    </button>
    <button class="big tst" id="goTest">
      <span class="bigt">اختبار</span>
      <span class="bigs">مثل الاختبار الحقيقي. الإجابات في النهاية فقط.</span>
    </button>
  </div>
  <p class="restmsg" id="restmsg" hidden></p>

  <div class="starline"><span>⭐</span><span id="starsToday">٠</span><span class="muted" style="font-size:17px">نجمة اليوم</span></div>
  <div class="starbar"><span id="starfill" style="width:0%"></span></div>
  <p class="muted" id="prizeline" style="font-size:17px;margin:0"></p>

  <div class="badges" id="badges"></div>
</section>

<!-- ======= تأكيد الاختبار ======= -->
<section class="wrap" id="v-testconfirm" hidden>
  <h1>الاختبار</h1>
  <div class="card">
    <p class="prompt" style="font-size:22px">هذا اختبار كامل مثل الاختبار الحقيقي.</p>
    <ul class="facts">
      <li>٦٤ سؤالاً في ١٢ قسماً</li>
      <li>١٠٣ دقائق</li>
      <li>لا تظهر أيّ إجابة أثناء الاختبار</li>
      <li>القسم يُغلق عند انتهاء وقته ولا يُفتح مرة أخرى</li>
      <li>النتيجة ومراجعة الأسئلة في النهاية</li>
    </ul>
    <div class="rowbtns">
      <button class="btn go" id="examStart">ابدئي الاختبار</button>
      <button class="btn" id="examBack">رجوع</button>
    </div>
  </div>
</section>

<!-- ======= البطاقة ======= -->
<section id="v-card" hidden>
  <div class="cardtop">
    <div class="pips" id="pips"></div>
    <div class="timerdot" id="tdot"><span id="tfill" style="height:0%"></span></div>
  </div>
  <div class="wrap" id="cardbody"></div>
</section>

<!-- ======= النهاية ======= -->
<section class="wrap" id="v-done" hidden>
  <div class="bigstar" id="doneStars">٠</div>
  <p style="font-size:24px">نجمة اليوم</p>
  <div class="celebrate" id="celebrate" hidden></div>
  <button class="btn go" id="doneHome" style="max-width:320px">تمام</button>
</section>

<script src="generator.js"></script>
<script src="content/icons.js"></script><script src="icons-blend.js"></script>
<script src="content/shapes.js"></script>
<script src="content/diagrams.js"></script>
<script src="store.js"></script>
<script src="bank.js"></script>
<script src="scheduler.js"></script>
<script src="session.js"></script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
