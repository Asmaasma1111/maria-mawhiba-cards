<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="بطاقات ماريا">
<meta name="theme-color" content="#cf5a8c">
<link rel="manifest" href="manifest.json">
<title>بطاقات ماريا</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ======= الرئيسية ======= -->
<section class="home" id="v-home" hidden>
  <button class="gear" id="gear" aria-label="إعدادات">⚙</button>
  <p class="hello" id="hello">أهلاً ماريا</p>
  <button class="big" id="start">تدرّبي اليوم</button>
  <p class="restmsg" id="restmsg" hidden></p>

  <div class="starline"><span>⭐</span><span id="starsToday">٠</span><span class="muted" style="font-size:17px">نجمة اليوم</span></div>
  <div class="starbar"><span id="starfill" style="width:0%"></span></div>
  <p class="muted" id="prizeline" style="font-size:17px;margin:0"></p>

  <div class="badges" id="badges"></div>
</section>

<!-- ======= البطاقة ======= -->
<section id="v-card" hidden>
  <div class="cardtop">
    <div class="pips" id="pips"></div>
    <div class="timerdot" id="tdot"><span id="tfill" style="height:0%"></span></div>
  </div>
  <div class="wrap" id="cardbody"></div>
</section>

<!-- ======= النهاية ======= -->
<section class="wrap done" id="v-done" hidden>
  <div class="bigstar" id="doneStars">٠</div>
  <p style="font-size:24px">نجمة اليوم</p>
  <div class="celebrate" id="celebrate" hidden></div>
  <button class="btn go" id="doneHome" style="max-width:320px">تمام</button>
</section>

<script src="generator.js"></script>
<script src="content/icons.js"></script>
<script src="content/shapes.js"></script>
<script src="content/diagrams.js"></script>
<script src="store.js"></script>
<script src="bank.js"></script>
<script src="scheduler.js"></script>
<script src="session.js"></script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
